services:
  jira-tocantins-api:
    build: .
    container_name: jira-tocantins-api
    restart: unless-stopped
    ports:
      # host:container
      - "${HOST_PORT:-3000}:3000"
    network_mode: bridge
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - HOME=/home/app
    # Mesmo UID do usuário "casa" no host: permite ler/gravar a configuração
    # do TWG montada abaixo e garante acesso ao SQLite em ./data.
    user: "1000:1000"
    volumes:
      # Persistencia do SQLite (usuarios aprovados)
      - ./data:/app/data
      # TWG auth e binário para busca Confluence
      # (padroes Linux do host; sobrescreva TWG_BIN_HOST/TWG_CONFIG_HOST se preciso)
      - ${TWG_BIN_HOST:-/home/casa/.local/bin}:/opt/twg/bin:ro
      - ${TWG_CONFIG_HOST:-/home/casa/.config/twg}:/home/app/.config/twg
      # Cache gravável do TWG dentro do container
      - ./data/twg-cache:/home/app/.cache/twg
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s