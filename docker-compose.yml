services:
  jira-tocantins-api:
    build: .
    container_name: jira-tocantins-api
    restart: unless-stopped
    ports:
      # host:container
      - "${HOST_PORT:-3000}:3000"
    network_mode: bridge
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s